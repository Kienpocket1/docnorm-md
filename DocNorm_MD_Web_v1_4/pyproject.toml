[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docnorm-md-web"
version = "1.4.0"
description = "Local-first PDF/DOCX to normalized Markdown web application"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "python-multipart>=0.0.20,<1",
    "jinja2>=3.1,<4",
    "pydantic>=2,<3",
    "PyMuPDF>=1.25,<2",
    "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
]

[tool.setuptools]
packages = ["docnorm_web"]
include-package-data = true

[tool.setuptools.package-data]
docnorm_web = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff.lint]
# FastAPI form declarations and worker/process boundaries intentionally use
# framework calls and broad exception capture to turn failures into manifests.
ignore = ["B008", "BLE001", "S112", "SIM102"]
